{%- if page.breadcrumb -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": {{ site.url | append: "/" | jsonify }}
    }{% for crumb in page.breadcrumb %}{% assign crumb_url = crumb.url | default: page.url %},
    {
      "@type": "ListItem",
      "position": {{ forloop.index | plus: 1 }},
      "name": {{ crumb.title | jsonify }},
      "item": {{ site.url | append: crumb_url | jsonify }}
    }{% endfor %}
  ]
}
</script>
{%- endif -%}
